name: Build & Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.CascadeLyrics/Jellyfin.Plugin.CascadeLyrics.csproj

      - name: Build
        run: |
          dotnet build Jellyfin.Plugin.CascadeLyrics/Jellyfin.Plugin.CascadeLyrics.csproj \
            --configuration Release \
            --no-restore \
            -o ./build

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build
          zip "../Jellyfin.Plugin.CascadeLyrics_${VERSION}.zip" Jellyfin.Plugin.CascadeLyrics.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
